# Windows 版：手动触发（发版脚本 脚本/发布安装包.sh 会触发它），在 GitHub 的 Windows 机器上编译，打成 zip 留作构建产物；
# 发版脚本把它下载下来，和 Mac 的 DMG 一起传到自动更新的服务器和 Releases。
# 没有代码签名证书，第一次运行 Windows 会提示「已保护你的电脑」，点「仍要运行」。
name: windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build --release -p beayy
      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/beayy.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Beayy-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Beayy-windows-x64
          path: Beayy-windows-x64.zip
