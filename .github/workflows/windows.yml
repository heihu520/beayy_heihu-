# Windows 版：发布新版（Releases）时，或手动触发时，在 GitHub 的 Windows 机器上编译，打成 zip 附到这一版上。
# 没有代码签名证书，第一次运行 Windows 会提示「已保护你的电脑」，点「仍要运行」。
name: windows
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译
        run: cargo build --release -p beayy
      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/beayy.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath Beayy-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Beayy-windows-x64
          path: Beayy-windows-x64.zip
      - name: 附到这一版
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" Beayy-windows-x64.zip --clobber
