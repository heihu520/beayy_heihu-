# iOS TestFlight 骨架：仅手动触发；Secrets 未齐时直接跳过，不失败。
# 上游用 XcodeGen（ios/project.yml）生成工程；此处不自动发版，只留挂钩。
#
# 需要的 Secrets（全部配置后才会真正跑构建步骤）：
#   APPLE_API_KEY_ID
#   APPLE_API_ISSUER_ID
#   APPLE_API_KEY_P8          # .p8 文件全文
#   IOS_TEAM_ID              # 可选，覆盖工程里的团队 ID
#   MATCH_*/ASC_*            # 若改用 fastlane match 再补
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只检查 Secrets / 生成工程，不上传 TestFlight"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER_ID}" ] && [ -n "${APPLE_API_KEY_P8}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Secrets 已齐，允许继续"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::缺少 APPLE_API_* Secrets，本 run 以骨架模式结束（不失败）。配齐后再手动跑。"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          if [ -f project.yml ]; then
            xcodegen generate
          else
            echo "::error::找不到 ios/project.yml"
            exit 1
          fi

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Placeholder archive / upload
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          echo "::warning::骨架：在此接 xcodebuild archive + altool/notary/Transporter 或 fastlane beta。"
          echo "Key id=$APPLE_API_KEY_ID issuer=$APPLE_API_ISSUER_ID team=${IOS_TEAM_ID:-unset}"
          echo "请按你们的签名 / bundle id 改造后再启用实际上传。"
          exit 1

      - name: Dry run OK
        if: ${{ inputs.dry_run }}
        run: echo "dry_run=true：工程已生成，未上传 TestFlight。"
