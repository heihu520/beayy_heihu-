# PR / push 到 main：Rust 格式、Clippy、测试（仅 macOS + Windows），以及轻量 Python 服务端检查。
# 跳过 Linux：beayy-capture 仅有 macOS / Windows 实现。
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          # 排除仅供 iOS 静态库的 mobile，避免污染桌面缓存键
          cache-targets: true

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # 排除 beayy-mobile（iOS staticlib）；桌面工作区其余成员均检查
        run: cargo clippy --workspace --exclude beayy-mobile --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --exclude beayy-mobile --all-targets

  python-server:
    name: python-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install requirements
        working-directory: server
        run: pip install -r requirements.txt

      - name: Syntax / import check
        working-directory: server
        run: |
          python -m compileall -q .
          python -c "import server, syncapi, usage, admin"
