# 每 6 小时（及手动）从上游 hengfengliya/beayy 拉 main，推到本仓分支 upstream-main，
# 并开/更新指向 main 的同步 PR。冲突不会静默吞掉：PR 会处于不可合并状态并留评论。
#
# 若同步会改动 .github/workflows/*，默认 GITHUB_TOKEN 推不上去，请在仓库 Secrets 里加
# GH_PAT（classic PAT，勾选 repo + workflow），本 workflow 会优先使用它。
name: upstream-sync

on:
  schedule:
    # 每 6 小时（UTC）
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Warn if GH_PAT missing
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT}" ]; then
            echo "::warning::未配置 secrets.GH_PAT。若上游变更包含 workflow 文件，push 可能失败；请添加 classic PAT（repo + workflow）。"
          else
            echo "将使用 secrets.GH_PAT 进行 checkout / push / gh。"
          fi

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 空 Secret 在表达式里为假，回退到 github.token
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and refresh upstream-main
        id: fetch
        env:
          UPSTREAM: https://github.com/hengfengliya/beayy.git
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "$UPSTREAM"
          git fetch upstream main --tags

          UPSTREAM_SHA=$(git rev-parse upstream/main)
          echo "upstream_sha=${UPSTREAM_SHA}" >> "$GITHUB_OUTPUT"
          echo "上游 main = ${UPSTREAM_SHA}"

          # 将 upstream-main 强制对齐到上游 tip（不在此做本地 merge，冲突交给 PR 展示）
          git checkout -B upstream-main upstream/main

          if git push -u origin upstream-main --force; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::error::推送 upstream-main 失败。常见原因：未配置 GH_PAT（workflow 文件权限），或分支保护。本 job 将失败，不会静默跳过。"
            exit 1
          fi

      - name: Open or update sync PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          UPSTREAM_SHA: ${{ steps.fetch.outputs.upstream_sha }}
        run: |
          set -euo pipefail

          TITLE="chore(sync): merge upstream hengfengliya/beayy@${UPSTREAM_SHA:0:7}"
          BODY=$(cat <<'MD'
          ## 上游同步

          自动从 [`hengfengliya/beayy`](https://github.com/hengfengliya/beayy) 的 `main` 同步到本 fork。

          - 源分支：`upstream-main`（与上游 tip 对齐）
          - 目标：`main`
          - 触发：每 6 小时 cron 或手动 `workflow_dispatch`

          ### 冲突处理
          若 GitHub 显示 **This branch has conflicts**，请本地解决后推回本 PR，**不要**忽略。
          流水线在检测到不可合并时会在本 PR 留评论并让同步 job 以非零退出（见下方检查步骤）。

          ### Token
          若 PR 里含 `.github/workflows` 变更且 push 失败，请配置仓库 Secret `GH_PAT`（classic，`repo` + `workflow`）。
          MD
          )

          EXISTING=$(gh pr list --base main --head upstream-main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "已有打开的同步 PR #$EXISTING，更新标题/正文"
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY"
            echo "pr_number=$EXISTING" >> "$GITHUB_ENV"
          else
            # 若 main 已包含上游 tip，无需开 PR
            git fetch origin main
            if git merge-base --is-ancestor upstream/main origin/main 2>/dev/null; then
              echo "origin/main 已包含上游 tip，跳过开 PR"
              echo "pr_number=" >> "$GITHUB_ENV"
              echo "skip_merge_check=1" >> "$GITHUB_ENV"
              exit 0
            fi
            URL=$(gh pr create --base main --head upstream-main --title "$TITLE" --body "$BODY")
            echo "已创建 PR: $URL"
            NUM=$(echo "$URL" | grep -oE '[0-9]+$')
            echo "pr_number=$NUM" >> "$GITHUB_ENV"
          fi
          echo "skip_merge_check=0" >> "$GITHUB_ENV"

      - name: Fail loudly on merge conflicts
        if: env.skip_merge_check != '1' && env.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_NUMBER: ${{ env.pr_number }}
        run: |
          set -euo pipefail
          # 稍等 GitHub 计算 mergeable
          for i in 1 2 3 4 5 6; do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeable,mergeStateStatus --jq '"\(.mergeable)|\(.mergeStateStatus)"')
            echo "merge check try $i: $STATE"
            MERGEABLE=${STATE%%|*}
            if [ "$MERGEABLE" = "MERGEABLE" ] || [ "$MERGEABLE" = "CONFLICTING" ]; then
              break
            fi
            sleep 5
          done

          MERGEABLE=$(gh pr view "$PR_NUMBER" --json mergeable --jq .mergeable)
          STATUS=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq .mergeStateStatus)
          echo "mergeable=$MERGEABLE status=$STATUS"

          if [ "$MERGEABLE" = "CONFLICTING" ] || [ "$STATUS" = "DIRTY" ]; then
            gh pr comment "$PR_NUMBER" --body "$(cat <<'MD'
          ⚠️ **上游同步存在合并冲突**（`upstream-main` → `main`）。

          流水线不会静默跳过。请手动解决冲突后推送到本 PR，或临时暂停 `upstream-sync` workflow。
          MD
          )"
            echo "::error::同步 PR #$PR_NUMBER 存在冲突（mergeable=$MERGEABLE status=$STATUS）"
            exit 1
          fi

          if [ "$MERGEABLE" = "MERGEABLE" ]; then
            echo "PR 可合并，同步成功"
            exit 0
          fi

          # UNKNOWN 等瞬时状态：开了 PR 即视为成功，但打警告
          echo "::warning::未能确认 mergeable（$MERGEABLE / $STATUS）；PR 已打开/更新，请人工确认。"
