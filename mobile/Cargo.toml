[package]
name = "beayy-mobile"
description = "Beayy 手机版的 Rust 核心（iOS 静态库）：和电脑同一套数据代码（直接引用 src-tauri/src 的 data、amap、sync、storage、icons），经 C 接口给 iPhone app 里的网页（同一套 ui/）调用"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "beayy_mobile"
crate-type = ["staticlib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
beayy-core.workspace = true
beayy-summary.workspace = true
beayy-sync.workspace = true
beayy-remote.workspace = true
regex = "1"
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
pollster = "0.4"
