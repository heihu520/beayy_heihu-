[package]
name = "beayy-mobile"
description = "Beayy 手机版的 Rust 核心：和电脑同一套数据代码，经 C/JNI 接口给 iPhone／Android 里的网页（同一套 ui/）调用"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "beayy_mobile"
# iOS 用 staticlib；Android 用 cdylib（.so）；rlib 给单元测试
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
beayy-core.workspace = true
beayy-summary.workspace = true
beayy-sync.workspace = true
beayy-remote.workspace = true
regex = "1"
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
pollster = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
