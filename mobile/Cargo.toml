[package]
name = "beayy-mobile"
description = "Beayy 手机版的 Rust 核心（iOS 静态库、安卓 .so）：和电脑同一套数据代码（直接引用 src-tauri/src 的 data、amap、sync、storage、icons），经 C 接口（安卓经 JNI）给手机 app 里的网页（同一套 ui/）调用"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "beayy_mobile"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
beayy-core.workspace = true
beayy-summary.workspace = true
beayy-sync.workspace = true
beayy-remote.workspace = true
regex = "1"
pollster = "0.4"

# 安卓没有系统 TLS 库，改用 rustls（见 beayy_core::tls!）
[target.'cfg(not(target_os = "android"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(target_os = "android")'.dependencies]
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
jni = { version = "0.21", default-features = false }
