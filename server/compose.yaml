# Beayy 服务端。用法见 README.md：
#   docker compose up -d                          只起同步服务（beayy-server）
#   docker compose --profile asr up -d            加上转写（beayy-asr，CPU 跑，要 4G 以上内存）
#   docker compose --profile caddy up -d          加上 Caddy 自动 HTTPS（VPS，域名写进 .env 的 BEAYY_DOMAIN）
#   docker compose --profile tunnel up -d         加上 Cloudflare 隧道（.env 的 CLOUDFLARE_TUNNEL_TOKEN）
# 配置在 .env（照 .env.example 写），数据都在这个目录下的 data/、backup/，搬家整个目录拷走即可。
x-common: &common
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  volumes:
    - ./data/sync:/data/sync
    - ./data/jobs:/data/jobs
    - ./backup:/backup

services:
  beayy-server:
    <<: *common
    build: .
    image: beayy-server
    ports:
      # 默认只给本机（反向代理在本机时够用）；要让局域网、Tailscale 里的设备直连，.env 里写 BEAYY_BIND=0.0.0.0
      - "${BEAYY_BIND:-127.0.0.1}:${BEAYY_PORT:-8770}:8770"

  beayy-asr:
    <<: *common
    profiles: [asr]
    build:
      context: .
      dockerfile: Dockerfile.asr
    image: beayy-asr
    volumes:
      - ./data/sync:/data/sync
      - ./data/jobs:/data/jobs
      - ./backup:/backup
      - ./data/models:/models
    environment:
      OMP_NUM_THREADS: ${BEAYY_ASR_THREADS:-4}
      MKL_NUM_THREADS: ${BEAYY_ASR_THREADS:-4}

  caddy:
    profiles: [caddy]
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      BEAYY_DOMAIN: ${BEAYY_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
